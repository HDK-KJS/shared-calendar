<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar</title>
<link rel="manifest" href="/assets/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" href="/assets/icon-192.png">
<meta name="theme-color" content="#f4eee2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendar">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#f4eee2;--card:#fbf8f1;--ink:#2f2a24;--mute:#70665a;--seg:#e8dfcf;--line:#e6dccb;--acc:#5a4a3a;--ai:#fbf8f1;--hol:#9c4a22;--c1:#5f7f94;--c2:#b5654a;--c3:#7b8a5a;--c4:#d1a03c;--c5:#8a6a86;--c6:#a39887;--t1:#dde6e8;--t2:#f0dcd2;--t3:#e3e7d2;--t4:#f3e6c4;--t5:#eadfe6;--t6:#e9e3d8}
@media (prefers-color-scheme:dark){:root{--bg:#1c1814;--card:#26211b;--ink:#f0e8da;--mute:#a99d8c;--seg:#2f2921;--line:#352f26;--acc:#e8dcc6;--ai:#1c1814;--hol:#e0a070;--c1:#8fb0c4;--c2:#d98b6a;--c3:#a5b57e;--c4:#e3b85a;--c5:#c39fb6;--c6:#b3a897;--t1:#233039;--t2:#3a2a22;--t3:#2c3322;--t4:#3b3119;--t5:#3a2b37;--t6:#2f2a23}}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior-x:none}
main{max-width:520px;margin:0 auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:14px}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:44px}
button{cursor:pointer;border:0}button:disabled{opacity:.3}
.hd{display:flex;align-items:center;gap:6px}.mo{flex:1;min-width:0;font-size:clamp(22px,7vw,28px);line-height:1.1;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mo span{font-size:17px;font-weight:500;color:var(--mute);margin-left:2px}.mo.sm{font-size:clamp(16px,5vw,20px)}
.rb{width:44px;height:44px;border-radius:50%;padding:0;background:var(--card);font-size:20px}.hd .rb{width:36px;height:36px;font-size:18px}.hd .tdy{height:34px;border-radius:17px;padding:0 11px;font:600 12px Inter,system-ui;background:var(--seg)}
.sg{display:flex;background:var(--seg);border-radius:14px;padding:4px;gap:4px}.sg button{flex:1;height:40px;min-height:0;border-radius:11px;background:transparent;color:var(--mute);font:600 14px Inter,system-ui;padding:0}.sg .on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cd{background:var(--card);border-radius:24px;padding:12px 10px 8px}
.wd,.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.wd div{text-align:center;font:600 11px Inter,system-ui;color:var(--mute);padding:4px 0 8px}
.d{display:flex;flex-direction:column;align-items:center;padding-top:3px;cursor:pointer;position:relative;z-index:1;border-left:1px solid var(--line)}.d:first-child{border-left:0}.wk+.wk{border-top:1px solid var(--line)}
.d em{font-style:normal;width:32px;height:32px;line-height:32px;border-radius:12px;text-align:center;font-weight:500;font-size:14px}
.d.t em{background:var(--acc);color:var(--ai)}.d.s em{box-shadow:inset 0 0 0 2px var(--acc)}.d.h em{color:var(--hol);font-weight:700}.d.o em{opacity:.4}
.dts{display:flex;gap:3px;height:5px}.dts s{width:5px;height:5px;border-radius:50%}
.br{z-index:2;display:block;height:18px;line-height:18px;font-size:10.5px;font-weight:600;padding:0 5px;margin:0 2px 2px;border-radius:6px;border-left:3px solid var(--c);background:var(--t);background:color-mix(in srgb,var(--c) 28%,var(--card));color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.br.ce{margin-right:0;border-radius:6px 0 0 6px}.br.cs{margin-left:0;border-left:0;border-radius:0 6px 6px 0}.br.cs.ce{border-radius:0}
.k1{--c:var(--c1);--t:var(--t1)}.k2{--c:var(--c2);--t:var(--t2)}.k3{--c:var(--c3);--t:var(--t3)}.k4{--c:var(--c4);--t:var(--t4)}.k5{--c:var(--c5);--t:var(--t5)}.k6{--c:var(--c6);--t:var(--t6)}
.ld{background:var(--c)}
.lg{display:flex;justify-content:space-between;font:500 clamp(8.5px,2.7vw,11px) Inter,system-ui;color:var(--mute);padding:0 2px;white-space:nowrap}.lg .ld{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}
.sh{display:flex;align-items:center}.sh>div{flex:1}.sh b{display:block;font-size:18px}.sh small{color:var(--mute);font-size:12px}.pl{background:var(--acc);color:var(--ai);font-size:24px}
.ev{display:flex;align-items:center;gap:12px;border-radius:20px;padding:14px 16px;min-height:64px;background:var(--t);cursor:pointer}.ev .ld{width:10px;height:10px;border-radius:50%;flex:none}
.et{flex:1;min-width:0}.et b{display:block;font-size:15px}.et small{font-size:12px;opacity:.75}.tg{font:600 11px Inter,system-ui;opacity:.75}
.gl{font:600 12px Inter,system-ui;color:var(--mute);margin:4px 0 -2px}.tr{display:flex;gap:10px;align-items:stretch}.tt{width:60px;flex:none;font:600 12px Inter,system-ui;color:var(--mute);padding-top:22px}.tr .ev{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}.em{color:var(--mute);margin:4px 0;font-size:14px}
.wr{display:flex;gap:12px;background:var(--card);border-radius:20px;padding:10px}.wr.tn{box-shadow:inset 0 0 0 2px var(--acc)}.wl{width:48px;flex:none;text-align:center;font:600 12px Inter,system-ui;color:var(--mute)}.wl span{display:block;font-size:20px;color:var(--ink)}.wl small{display:block;color:var(--hol);font-size:9px;line-height:1.1}.wc{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}.wc .ev{min-height:48px;padding:8px 12px;border-radius:14px}
@keyframes inr{from{opacity:.2;transform:translateX(28px)}to{opacity:1;transform:none}}@keyframes inl{from{opacity:.2;transform:translateX(-28px)}to{opacity:1;transform:none}}
.in-r{animation:inr .22s ease-out}.in-l{animation:inl .22s ease-out}
#view{display:flex;flex-direction:column;gap:14px}
#tip{position:fixed;display:none;z-index:50;max-width:260px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font:12px/1.4 Inter,system-ui;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);width:min(440px,94vw);max-height:92vh;overflow:auto;padding:18px}dialog::backdrop{background:rgba(0,0,0,.4)}
dialog button:focus{outline:none}
label{display:block;font:500 12px Inter,system-ui;color:var(--mute);margin-top:10px}dialog input,dialog select,dialog textarea{width:100%;font-size:16px}
.fb{display:flex;gap:8px;margin-top:16px}.fb .sp{flex:1}.bt{height:44px;padding:0 18px;border-radius:12px;background:var(--seg);font:600 14px Inter,system-ui}.bt.pri{background:var(--acc);color:var(--ai)}
.pvh{display:flex;gap:6px;align-items:flex-start}.pvt{flex:1;font-size:20px;font-weight:700;padding-top:8px}.pvc{display:inline-block;font:600 12px Inter,system-ui;padding:3px 12px;border-radius:12px;margin-top:6px;background:var(--t)}
.pvb{font-size:14px;line-height:1.5;margin-top:10px}.pvb p{margin:6px 0}.pvn{white-space:pre-wrap;margin-top:10px}.note{font-size:12px;color:var(--mute)}
@media(max-width:340px){.mo span{display:none}}
@media(max-width:700px){dialog{margin:auto 0 0;width:100%;max-width:100%;border-radius:22px 22px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}}
</style></head><body><main>
<div class="hd"><div class="mo" id="ttl"></div><button class="tdy" id="today">Today</button><button class="rb" id="prev" aria-label="Previous">‹</button><button class="rb" id="next" aria-label="Next">›</button></div>
<div class="sg"><button data-v="month" class="on">Month</button><button data-v="week">Week</button><button data-v="day">Day</button><button data-v="list">List</button></div>
<div id="view"></div>
<div class="note" id="status"></div>
<div id="tip"></div>
<dialog id="pv"><div class="pvh"><div class="pvt" id="pv-t"></div><button class="rb" id="pv-edit" aria-label="Edit">✎</button><button class="rb" id="pv-x" aria-label="Close">✕</button></div><span class="pvc" id="pv-c"></span><div class="pvb" id="pv-b"></div></dialog>
<dialog id="dlg"><div>
<b id="dt" style="font-size:18px">Add item</b>
<label>Title<input id="f-title" maxlength="150"></label>
<label>Start date<input id="f-date" type="date"></label>
<label>End date (optional, for trips or stays)<input id="f-end" type="date"></label>
<label>Time (optional)<input id="f-time" type="time"></label>
<label>Category<select id="f-cat"></select></label>
<label>Added by<select id="f-by"></select></label>
<label>Details / notes<textarea id="f-notes" rows="3" maxlength="2000"></textarea></label>
<div class="fb"><button class="bt" id="del" style="display:none">Delete</button><span class="sp"></span><button class="bt" id="cancel">Cancel</button><button class="bt pri" id="save">Save</button></div>
</div></dialog>
</main>
<script>
const CATS=["Travel","Appointment","Visitors","Holidays","Work","Other"],NAMES=["Kimmy","Hugh","Gwyn"];
// Victorian public holidays (source: business.vic.gov.au)
const HOL={"2026-12-25":"Christmas Day","2026-12-26":"Boxing Day","2026-12-28":"Boxing Day (additional)","2027-01-01":"New Year’s Day","2027-01-26":"Australia Day","2027-03-08":"Labour Day","2027-03-26":"Good Friday","2027-03-27":"Easter Saturday","2027-03-28":"Easter Sunday","2027-03-29":"Easter Monday","2027-04-25":"Anzac Day","2027-06-14":"King’s Birthday"};
const MIN="2026-11-01",MAX="2027-08-31";
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"],MS=MN.map(m=>m.slice(0,3)),DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse=s=>new Date(s+"T00:00:00");
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const weekStart=d=>addDays(d,-((d.getDay()+6)%7));
const clamp=d=>{const s=iso(d);return s<MIN?parse(MIN):s>MAX?parse(MAX):d};
const fmt=s=>parse(s).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"});
const full=s=>parse(s).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kc=e=>"k"+(CATS.indexOf(e.cat)+1||6);
const todayIso=iso(new Date());
let events=[],view="month",cur=clamp(new Date()),sel=iso(cur),editId=null,anim="",pvId=null,dayD=cur;
$("f-cat").innerHTML=CATS.map(c=>`<option>${c}</option>`).join("");
$("f-by").innerHTML='<option value="">Choose…</option>'+NAMES.map(n=>`<option>${n}</option>`).join("");
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status===401){location="/login";throw 0}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"Something went wrong");
  return j}
async function load(){try{events=await api("GET","/api/events");render();$("status").textContent=""}catch(e){if(e)$("status").textContent="Couldn’t load: "+e.message}}
const tm=t=>{const[h,m]=t.split(":");return new Date(2000,0,1,+h,+m).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"})};
const evs=s=>events.filter(e=>e.date<=s&&s<=(e.end_date||e.date)).sort((a,b)=>(a.time||"").localeCompare(b.time||"")||a.id-b.id);
const range=e=>fmt(e.date)+(e.end_date?" – "+fmt(e.end_date):"");
const card=(e,nt)=>`<div class="ev ${kc(e)}" data-id="${e.id}"><i class="ld"></i><div class="et"><b>${esc(e.title)}</b><small>${!nt&&e.time?tm(e.time)+" · ":""}${range(e)}${NAMES.includes(e.created_by)?" · "+e.created_by:""}</small></div><span class="tg">${esc(e.cat)}</span></div>`;
const head=(t,sub,d)=>`<div class="sh"><div><b>${t}</b><small>${sub}</small></div><button class="rb pl" data-add="${d}" aria-label="Add item">+</button></div>`;
const count=n=>n?n+(n===1?" item":" items"):"Nothing yet";
function weekHTML(ws,cm){
  const days=[...Array(7)].map((_,i)=>iso(addDays(ws,i))),we=days[6];
  const segs=events.filter(e=>e.date<=we&&(e.end_date||e.date)>=days[0]).map(e=>{const end=e.end_date||e.date;return{ev:e,s:e.date<=days[0]?0:days.indexOf(e.date),e:end>=we?6:days.indexOf(end),cs:e.date<days[0],ce:end>we}})
    .sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s)||a.ev.id-b.ev.id);
  const lanes=[];segs.forEach(g=>{let l=0;while(lanes[l]&&lanes[l].some(r=>g.s<=r[1]&&g.e>=r[0]))l++;(lanes[l]=lanes[l]||[]).push([g.s,g.e]);g.lane=l});
  return `<div class="wk" style="grid-template-rows:38px repeat(${lanes.length},20px)">`
   +days.map((s,i)=>{const d=addDays(ws,i);
     return `<div class="d${d.getMonth()!==cm?" o":""}${s===todayIso?" t":""}${HOL[s]?" h":""}" data-d="${s}" style="grid-column:${i+1};grid-row:1/${lanes.length+2}"><em>${d.getDate()}</em></div>`}).join("")
   +segs.map(g=>`<div class="br ${kc(g.ev)}${g.cs?" cs":""}${g.ce?" ce":""}" data-id="${g.ev.id}" style="grid-column:${g.s+1}/${g.e+2};grid-row:${g.lane+2}">${esc(g.ev.title)}</div>`).join("")+"</div>"}
function render(){
  $("ttl").className="mo"+(view==="week"?" sm":"");
  $("tip").style.display="none";
  document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  let h="",a,b;
  if(view==="month"){
    const y=cur.getFullYear(),m=cur.getMonth(),last=new Date(y,m+1,0);a=new Date(y,m,1);b=last;
    if(sel.slice(0,7)!==iso(a).slice(0,7))sel=iso(a);
    $("ttl").innerHTML=MN[m]+" <span>"+y+"</span>";
    h='<div class="cd"><div class="wd">'+DN.map(x=>`<div>${x}</div>`).join("")+"</div>";
    for(let ws=weekStart(a);ws<=last;ws=addDays(ws,7))h+=weekHTML(ws,m);
    h+='</div><div class="lg">'+CATS.map((c,i)=>`<span class="k${i+1}"><i class="ld"></i>${c}</span>`).join("")+"</div>";
    const ms=iso(a),me=iso(b);
    const mi=events.filter(e=>e.date<=me&&(e.end_date||e.date)>=ms).map(e=>({k:e.date<ms?ms:e.date,e}));
    const all=[...mi,...Object.keys(HOL).filter(d=>d>=ms&&d<=me).map(d=>({k:d,h:HOL[d]}))].sort((x,y)=>x.k.localeCompare(y.k)||(!!y.h-!!x.h)||((x.e&&y.e)?(x.e.time||"").localeCompare(y.e.time||""):0)||((x.e?x.e.id:0)-(y.e?y.e.id:0)));
    h+=head(MN[m]+" items",count(mi.length),todayIso>=ms&&todayIso<=me?todayIso:ms);
    h+='<div class="stack">'+all.map(x=>x.e?card(x.e):`<div class="ev" style="background:var(--seg);cursor:default"><i class="ld" style="background:var(--hol)"></i><div class="et"><b>${x.h}</b><small>${fmt(x.k)} · Public holiday</small></div></div>`).join("")+(!mi.length?'<p class="em">Nothing this month yet. Tap + to add something.</p>':"")+"</div>";
  }else if(view==="week"){
    const st=weekStart(cur),en=addDays(st,6);a=st;b=en;
    $("ttl").textContent=st.getDate()+" "+MS[st.getMonth()]+" – "+en.getDate()+" "+MS[en.getMonth()];
    h='<div class="stack">'+[...Array(7)].map((_,i)=>{const d=addDays(st,i),s=iso(d),l=evs(s);
      return `<div class="wr${s===todayIso?" tn":""}" data-add="${s}"><div class="wl" data-day="${s}">${DN[i]}<span>${d.getDate()}</span>${HOL[s]?`<small>${HOL[s]}</small>`:""}</div><div class="wc">${l.map(e=>card(e)).join("")}</div></div>`}).join("")+"</div>";
  }else if(view==="day"){
    const s=iso(dayD);a=b=dayD;
    $("ttl").innerHTML=dayD.toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short"})+" <span>"+dayD.getFullYear()+"</span>";
    const l=evs(s),tOf=e=>e.date===s?e.time:"";
    const ad=l.filter(e=>!tOf(e)),td=l.filter(e=>tOf(e)).sort((x,y)=>x.time.localeCompare(y.time)||x.id-y.id);
    h=head(dayD.toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long"}),(HOL[s]?HOL[s]+" · ":"")+count(l.length),s);
    h+='<div class="stack">'+(HOL[s]?`<div class="ev" style="background:var(--seg);cursor:default"><i class="ld" style="background:var(--hol)"></i><div class="et"><b>${HOL[s]}</b><small>Victorian public holiday</small></div></div>`:"")+(ad.length?'<div class="gl">All day</div>'+ad.map(e=>card(e,1)).join(""):"")+td.map(e=>`<div class="tr"><div class="tt">${tm(e.time)}</div>${card(e,1)}</div>`).join("")+(!l.length&&!HOL[s]?'<p class="em">Nothing on this day. Tap + to add something.</p>':"")+"</div>";
  }else{
    $("ttl").textContent="Coming up";
    const l=events.filter(e=>(e.end_date||e.date)>=todayIso&&e.date<=MAX).sort((x,y)=>x.date.localeCompare(y.date)||(x.time||"").localeCompare(y.time||"")||x.id-y.id);
    h=head("Upcoming",count(l.length),todayIso)+'<div class="stack">'+l.map(e=>card(e)).join("")+"</div>";
  }
  $("view").innerHTML=h;$("view").className=anim;anim="";
  $("prev").disabled=view==="list"||iso(a)<=MIN;$("next").disabled=view==="list"||iso(b)>=MAX;
}
function nav(n){anim=n>0?"in-r":"in-l";if(view==="day"){dayD=clamp(addDays(dayD,n));render();return}cur=clamp(view==="month"?new Date(cur.getFullYear(),cur.getMonth()+n,1):addDays(cur,7*n));if(view==="month"){const t=new Date();sel=(cur.getMonth()===t.getMonth()&&cur.getFullYear()===t.getFullYear())?todayIso:iso(cur)}render()}
$("prev").onclick=()=>nav(-1);$("next").onclick=()=>nav(1);
$("today").onclick=()=>{cur=clamp(new Date());sel=iso(cur);dayD=cur;render()};
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
function openDlg(id,date){editId=id;const e=events.find(x=>String(x.id)===String(id))||{};$("tip").style.display="none";
  $("dt").textContent=id?"Edit item":"Add item";$("f-title").value=e.title||"";$("f-date").value=e.date||date||sel;
  $("f-end").value=e.end_date||"";$("f-time").value=e.time||"";$("f-cat").value=e.cat||"Other";$("f-notes").value=e.notes||"";
  let last="";try{last=localStorage.getItem("by")||""}catch(_){}
  $("f-by").value=id?(NAMES.includes(e.created_by)?e.created_by:""):last;
  $("del").style.display=id?"":"none";$("dlg").showModal()}
function openPv(id){const e=events.find(x=>String(x.id)===String(id));if(!e)return;pvId=id;$("tip").style.display="none";
  $("pv-t").textContent=e.title;$("pv-c").textContent=e.cat;$("pv-c").className="pvc "+kc(e);
  $("pv-b").innerHTML=`<p>${full(e.date)}${e.time?" · "+tm(e.time):""}${e.end_date?" – "+full(e.end_date):""}</p>${NAMES.includes(e.created_by)?`<p>Added by ${e.created_by}</p>`:""}${e.notes?`<div class="pvn">${esc(e.notes)}</div>`:""}`;
  $("pv").showModal()}
$("pv-x").onclick=()=>$("pv").close();
$("pv-edit").onclick=()=>{$("pv").close();openDlg(pvId)};
$("pv").addEventListener("click",e=>{if(e.target===$("pv"))$("pv").close()});
$("view").onclick=e=>{
  const ev=e.target.closest("[data-id]");if(ev)return openPv(ev.dataset.id);
  const dd=e.target.closest("[data-day]");if(dd){dayD=clamp(parse(dd.dataset.day));view="day";return render()}
  const a=e.target.closest("[data-add]");if(a)return openDlg(null,a.dataset.add);
  const c=e.target.closest("[data-d]");if(c&&view==="month")openDlg(null,c.dataset.d)};
$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=async()=>{const t=$("f-title").value.trim(),d=$("f-date").value,en=$("f-end").value;if(!t||!d){alert("Add a title and a start date.");return}
  if(en&&en<d){alert("The end date can’t be before the start date.");return}
  const data={title:t,date:d,end_date:en,time:$("f-time").value,cat:$("f-cat").value,notes:$("f-notes").value.trim()};
  const by=$("f-by").value;if(by)data.created_by=by;if(!editId){if(!by){alert("Choose who’s adding this.");return}try{localStorage.setItem("by",by)}catch(_){}}
  $("dlg").close();
  try{editId?await api("PUT","/api/events/"+editId,data):await api("POST","/api/events",data);await load()}catch(e){if(e)$("status").textContent="Couldn’t save: "+e.message}};
$("del").onclick=async()=>{if(!confirm("Delete this item?"))return;$("dlg").close();
  try{await api("DELETE","/api/events/"+editId);await load()}catch(e){if(e)$("status").textContent="Couldn’t delete: "+e.message}};
let tx=0,ty=0;
$("view").addEventListener("touchstart",e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
$("view").addEventListener("touchend",e=>{if(view==="list")return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>1.5*Math.abs(dy))nav(dx<0?1:-1)},{passive:true});
const tip=$("tip");
function tipHTML(e){return `<b>${esc(e.title)}</b><br>${e.time?tm(e.time)+" · ":""}${range(e)}<br>${esc(e.cat)}${NAMES.includes(e.created_by)?" · "+e.created_by:""}${e.notes?`<div style="margin-top:4px;white-space:pre-wrap">${esc(e.notes)}</div>`:""}`}
function place(x,y){const w=tip.offsetWidth,h=tip.offsetHeight;let l=x+14,t=y+16;if(l+w>innerWidth-8)l=x-w-14;if(t+h>innerHeight-8)t=y-h-14;tip.style.left=Math.max(8,l)+"px";tip.style.top=Math.max(8,t)+"px"}
if(matchMedia("(hover:hover)").matches){
  $("view").addEventListener("mouseover",e=>{const b=e.target.closest(".br,.mg");if(!b){tip.style.display="none";return}
    const ev=events.find(x=>String(x.id)===b.dataset.id);if(!ev)return;tip.innerHTML=tipHTML(ev);tip.style.display="block";place(e.clientX,e.clientY)});
  $("view").addEventListener("mousemove",e=>{if(tip.style.display==="block")place(e.clientX,e.clientY)});
  $("view").addEventListener("mouseleave",()=>tip.style.display="none");
}
setInterval(()=>{if(!$("dlg").open&&!$("pv").open&&!document.hidden)load()},20000);
render();load();
</script></body></html>
