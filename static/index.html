<!DOCTYPE html>
<html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shared Calendar</title>
<style>
:root{--bg:#f6efe3;--card:#fffaf0;--ink:#3b2a24;--mute:#8a7566;--line:#e3d6c2;--acc:#6d2332;--win:#f7edc6;--hol:#a4452c}
@media (prefers-color-scheme:dark){:root{--bg:#1f1814;--card:#2a211b;--ink:#f1e6d6;--mute:#b3a08c;--line:#43362c;--acc:#a8465a;--win:#3d3520;--hol:#e0906f}}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Georgia,"Times New Roman",serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:0 0 2px;font-weight:600}.sub{color:var(--mute);font-size:13px;margin-bottom:12px;font-family:system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-family:system-ui,sans-serif}
button,select,input,textarea{font:inherit;font-family:system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.sp{flex:1}.ttl{font-weight:600;min-width:150px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dh{background:var(--card);padding:4px;text-align:center;font:600 12px system-ui;color:var(--mute)}
.cell{background:var(--card);min-height:92px;padding:3px;cursor:pointer;overflow:hidden}
.cell.out{opacity:.45}.cell.win{background:var(--win)}.cell.today .n{background:var(--acc);color:#fff}
.n{display:inline-block;font:12px system-ui;min-width:20px;text-align:center;border-radius:10px;padding:1px 4px}
.ev{font:11px system-ui;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;cursor:pointer}
.hol{font:600 10px system-ui;color:var(--hol)}
.wk .cell{min-height:260px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;border-left:6px solid var(--acc)}
.row b{display:block}.row small{color:var(--mute);font-family:system-ui}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
label{display:block;font:12px system-ui;color:var(--mute);margin-top:8px}
dialog input,dialog select,dialog textarea{width:100%}
.note{font:12px system-ui;color:var(--mute);margin-top:12px}
@media(max-width:600px){.cell{min-height:64px}.ev{font-size:10px}}
</style></head><body><main>
<h1>Shared Calendar</h1>
<div class="sub">Tap a day to add something, tap an item to edit it. Red labels are Victorian public holidays. Shaded days are the date range we’re considering. <span id="me"></span> <a id="out" href="/logout" style="color:var(--acc);display:none">Sign out</a></div>
<div class="bar">
<button id="prev">‹</button><span class="ttl" id="ttl"></span><button id="next">›</button><button id="today">Today</button>
<span class="sp"></span>
<button data-v="month" class="on">Month</button><button data-v="week">Week</button><button data-v="list">List</button>
<button id="add" class="pri">+ Add</button>
</div>
<div style="overflow-x:auto"><div id="view"></div></div>
<div class="note" id="status"></div>
<dialog id="dlg"><div>
<b id="dt">Add item</b>
<label>Title<input id="f-title" maxlength="150"></label>
<label>Start date<input id="f-date" type="date"></label>
<label>End date (optional, for trips or stays)<input id="f-end" type="date"></label>
<label>Time (optional)<input id="f-time" type="time"></label>
<label>Colour<select id="f-color"></select></label>
<label>Details / notes<textarea id="f-notes" rows="3" maxlength="2000"></textarea></label>
<div class="note" id="by"></div>
<div class="bar" style="margin-top:12px"><button id="del" style="display:none">Delete</button><span class="sp"></span><button id="cancel">Cancel</button><button id="save" class="pri">Save</button></div>
</div></dialog>
</main>
<script>
const COL={burgundy:"#7a2a3a",chocolate:"#5e4030",caramel:"#8c6636",olive:"#6b7149",terracotta:"#a65a3a",taupe:"#85766a"};
const NORM={rose:"burgundy",blue:"chocolate",green:"olive",amber:"caramel",purple:"taupe",grey:"taupe"};// older colour names
// Victorian public holidays (source: business.vic.gov.au). Friday before the AFL Grand Final isn't included: the 2027 date isn't set yet.
const HOL={"2026-12-25":"Christmas Day","2026-12-26":"Boxing Day","2026-12-28":"Boxing Day (additional)","2027-01-01":"New Year’s Day","2027-01-26":"Australia Day","2027-03-08":"Labour Day","2027-03-26":"Good Friday","2027-03-27":"Easter Saturday","2027-03-28":"Easter Sunday","2027-03-29":"Easter Monday","2027-04-25":"Anzac Day","2027-06-14":"King’s Birthday","2027-11-02":"Melbourne Cup","2027-12-25":"Christmas Day","2027-12-26":"Boxing Day","2027-12-27":"Christmas Day (additional)","2027-12-28":"Boxing Day (additional)"};
const WIN=["2027-03-13","2027-04-11"];
let events=[],view="month",cur=new Date(2027,2,1),editId=null;
const $=id=>document.getElementById(id);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayIso=iso(new Date());
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
$("f-color").innerHTML=Object.keys(COL).map(c=>`<option value="${c}">${c[0].toUpperCase()+c.slice(1)}</option>`).join("");
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(r.status===401){location="/login";throw 0}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"Something went wrong");
  return j}
async function load(){try{events=await api("GET","/api/events");render();$("status").textContent=""}catch(e){if(e)$("status").textContent="Couldn’t load: "+e.message}}
function evs(d){return events.filter(e=>e.date<=d&&d<=(e.end_date||e.date)).sort((a,b)=>(a.time||"").localeCompare(b.time||""))}
function chip(e,d){const first=e.date===d;return `<div class="ev" data-id="${e.id}" style="background:${COL[NORM[e.color]||e.color]||COL.burgundy}" title="${esc(e.title)}">${first?esc(e.time):"↳"} ${esc(e.title)}</div>`}
function cell(d,out){const s=iso(d),w=s>=WIN[0]&&s<=WIN[1];
return `<div class="cell${out?" out":""}${w?" win":""}${s===todayIso?" today":""}" data-d="${s}"><span class="n">${d.getDate()}</span>${HOL[s]?`<div class="hol">${HOL[s]}</div>`:""}${evs(s).map(e=>chip(e,s)).join("")}</div>`}
function render(){
document.querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
let h="";const heads=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<div class="dh">${x}</div>`).join("");
if(view==="month"){
$("ttl").textContent=MN[cur.getMonth()]+" "+cur.getFullYear();
const f=new Date(cur.getFullYear(),cur.getMonth(),1),st=new Date(f);st.setDate(1-((f.getDay()+6)%7));
h='<div class="grid">'+heads;
for(let i=0;i<42;i++){const d=new Date(st);d.setDate(st.getDate()+i);if(i>=35&&d.getMonth()!==cur.getMonth())break;h+=cell(d,d.getMonth()!==cur.getMonth())}
h+="</div>";
}else if(view==="week"){
const st=new Date(cur);st.setDate(cur.getDate()-((cur.getDay()+6)%7));const en=new Date(st);en.setDate(st.getDate()+6);
$("ttl").textContent=st.getDate()+" "+MN[st.getMonth()].slice(0,3)+" – "+en.getDate()+" "+MN[en.getMonth()].slice(0,3)+" "+en.getFullYear();
h='<div class="grid wk">'+heads;
for(let i=0;i<7;i++){const d=new Date(st);d.setDate(st.getDate()+i);h+=cell(d,false)}h+="</div>";
}else{
$("ttl").textContent="All items";
h=events.length?events.map(e=>`<div class="row" data-id="${e.id}" style="border-left-color:${COL[NORM[e.color]||e.color]||COL.burgundy}"><b>${esc(e.title)}</b><small>${e.date}${e.end_date?" → "+e.end_date:""} ${esc(e.time)}</small>${e.notes?`<div>${esc(e.notes)}</div>`:""}</div>`).join(""):'<p class="sub">Nothing here yet. Use “+ Add” to start.</p>';
}
$("view").innerHTML=h;}
function nav(n){if(view==="month")cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);else if(view==="week")cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+7*n);render()}
$("prev").onclick=()=>nav(-1);$("next").onclick=()=>nav(1);
$("today").onclick=()=>{cur=new Date();render()};
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
function openDlg(id,date){editId=id;const e=events.find(x=>String(x.id)===String(id))||{};
$("dt").textContent=id?"Edit item":"Add item";$("f-title").value=e.title||"";$("f-date").value=e.date||date||iso(cur);
$("f-end").value=e.end_date||"";$("f-time").value=e.time||"";$("f-color").value=NORM[e.color]||e.color||"burgundy";$("f-notes").value=e.notes||"";
$("by").textContent=e.created_by?"Added by "+e.created_by:"";
$("del").style.display=id?"":"none";$("dlg").showModal()}
$("add").onclick=()=>openDlg(null);
$("view").onclick=e=>{const ev=e.target.closest("[data-id]");if(ev)return openDlg(ev.dataset.id);const c=e.target.closest("[data-d]");if(c)openDlg(null,c.dataset.d)};
$("cancel").onclick=()=>$("dlg").close();
$("save").onclick=async()=>{const t=$("f-title").value.trim(),d=$("f-date").value,en=$("f-end").value;if(!t||!d)return;
if(en&&en<d){$("status").textContent="End date can’t be before the start date.";return}
const data={title:t,date:d,end_date:en,time:$("f-time").value,color:$("f-color").value,notes:$("f-notes").value.trim()};
$("dlg").close();
try{editId?await api("PUT","/api/events/"+editId,data):await api("POST","/api/events",data);await load()}catch(e){if(e)$("status").textContent="Couldn’t save: "+e.message}};
$("del").onclick=async()=>{if(!confirm("Delete this item?"))return;$("dlg").close();
try{await api("DELETE","/api/events/"+editId);await load()}catch(e){if(e)$("status").textContent="Couldn’t delete: "+e.message}};
setInterval(()=>{if(!$("dlg").open&&!document.hidden)load()},20000);
api("GET","/api/me").then(m=>{if(m.auth){$("me").textContent="Signed in as "+m.name+".";$("out").style.display=""}}).catch(()=>{});
render();load();
</script></body></html>
